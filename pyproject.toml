[project]
name = "NyayaDocs"
version = "0.1.0"
description = "NyayaDocs Legal RAG Backend and Frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "llama-index>=0.12.0",
    "llama-index-embeddings-google-genai>=0.4.0",
    "llama-index-llms-gemini>=0.4.0",
    "llama-index-llms-google-genai>=0.4.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "streamlit>=1.38.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
ingestion = [
    "docling>=2.12.0",
]
