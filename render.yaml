services:
  - type: web
    name: nyayadocs-backend
    runtime: python
    buildCommand: uv sync --frozen --no-dev --index-strategy unsafe-best-match
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
